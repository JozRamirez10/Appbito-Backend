spring.application.name=appbito
server.port=${SERVER_PORT}

# ==========================================
# Database
# ==========================================
# Construimos la URL dinámicamente con las variables
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}

# ==========================================
# Files and logs
# ==========================================
logging.file.path=${LOG_PATH}
app.image-dir=${UPLOAD_PATH}
spring.web.resources.static-locations=${UPLOAD_STATIC_LOCATION}

# ==========================================
# Email
# ==========================================
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${EMAIL_HOST}

# ==========================================
# URLs externs
# ==========================================
app.verification.email.url=${FRONTEND_VERIFY_URL}