spring.application.name=appbito
server.port=${SERVER_PORT}

# ==========================================
# Database
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO}
spring.jpa.show-sql=${DB_SHOW_SQL}

spring.jpa.properties.hibernate.jdbc.batch_size=${DB_BATCH_SIZE}
spring.jpa.properties.hibernate.order_inserts=${DB_ORDER_INSERTS}
spring.jpa.properties.hibernate.generate_statistics=${DB_GENERATE_STATISTICS}

# ==========================================
# Files and logs
# ==========================================
app.image-dir=${UPLOAD_PATH}
spring.web.resources.static-locations=${UPLOAD_STATIC_LOCATION}

# ==========================================
# Email
# ==========================================
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${EMAIL_HOST}

# ==========================================
# URLs externs
# ==========================================
app.verification.email.url=${FRONTEND_VERIFY_URL}

# ==========================================
# Security configuration
# ==========================================
jwt.secret=${JWT_SECRET}
app.cookies.secure=${SECURE_COOKIE}
app.cors.allowed-origins=${ALLOWED_ORIGINS}