spring.application.name=appbito-test
server.port=8080

# ==========================================
# Database H2 
# ==========================================
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.generate_statistics=false

# ==========================================
# Files and logs
# ==========================================
app.image-dir=/tmp/appbito-test/uploads
spring.web.resources.static-locations=file:/tmp/appbito-test/uploads/

# ==========================================
# Email
# ==========================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=testuser
spring.mail.password=testpass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=localhost

# ==========================================
# URLs externs
# ==========================================
app.verification.email.url=http://localhost:4200/verify